name: Lint Renovate Configs

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "25"

      - name: Install Renovate
        run: npm install -g renovate@44

      - name: Validate configs
        run: |
          # Older Renovate versions do not support --no-global.
          FLAG=""
          if renovate-config-validator --help 2>&1 | grep -q -- "--no-global"; then
            FLAG="--no-global"
          fi
          for file in $(find . -name "*.json" -not -path "./node_modules/*"); do
            echo "Validating $file"
            renovate-config-validator $FLAG "$file"
          done
